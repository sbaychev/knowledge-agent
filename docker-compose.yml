services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowledge-agent-postgres
    environment:
      POSTGRES_DB: knowledge_agent
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Optional dependency for future HTTP-adapter tests. Not required by the
  # current application or by the standard Maven test suite.
  wiremock:
    image: wiremock/wiremock:3.13.1
    profiles: ["integration"]
    ports:
      - "${WIREMOCK_PORT:-8081}:8080"
    command: ["--verbose"]
    restart: unless-stopped

volumes:
  postgres_data:
