name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Allows Spring contexts to initialize without a real provider key.
      # Automated tests must not make live LLM requests.
      SPRING_AI_ANTHROPIC_API_KEY: ci-test-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done

      - name: Verify project
        run: mvn --batch-mode --no-transfer-progress clean verify
