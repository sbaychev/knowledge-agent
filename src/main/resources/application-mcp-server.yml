spring:
  ai:
    mcp:
      server:
        name: knowledge-agent
        version: ${APP_VERSION:1.0.0}
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true

# Loopback by default is suitable for local development. Explicitly opt into
# another bind address when running behind an authenticated/restricted network.
server:
  address: ${MCP_SERVER_BIND_ADDRESS:127.0.0.1}
