spring:
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
    tools:
      limits:
        max-calls-per-tool-default: ${AGENT_MAX_CALLS_PER_TOOL:8}
        max-total-tool-calls: ${agent.limits.max-tool-calls:15}
        on-limit-exceeded: THROW
    anthropic:
      timeout: ${LLM_TIMEOUT:30s}
      max-retries: ${LLM_MAX_RETRIES:1}
      base-url: ${LLM_BASE_URL:http://localhost:6655/anthropic}
      api-key: ${LLM_API_KEY:local-llm-proxy}
      chat:
        model: ${LLM_MODEL:claude-sonnet-latest}
        max-tokens: 2048

  datasource:
    url: jdbc:postgresql://localhost:5432/knowledge_agent
    username: knowledge
    password: knowledge

  jpa:
    show-sql: true

agent:
  memory:
    max-context-tokens: ${AGENT_MAX_CONTEXT_TOKENS:12000}
    max-iterations: ${AGENT_MAX_ITERATIONS:8}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:15}
  execution:
    timeout: ${AGENT_EXECUTION_TIMEOUT:30s}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: OFF
