spring:

  application:
    name: knowledge-agent

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowledge_agent}
    username: ${SPRING_DATASOURCE_USERNAME:knowledge_agent}
    password: ${SPRING_DATASOURCE_PASSWORD:knowledge_agent}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    model:
      embedding: none
      chat: ${SPRING_AI_MODEL_CHAT:anthropic}
      memory:
        repository:
          jdbc:
            initialize-schema: never
    vectorstore:
      type: none
    tools:
      limits:
        max-calls-per-tool-default: ${AGENT_MAX_CALLS_PER_TOOL:8}
        max-total-tool-calls: ${agent.limits.max-tool-calls:15}
        on-limit-exceeded: THROW
    openai:
      api-key: ${OPENAI_API_KEY:}
      timeout: 30s
      max-retries: 1
      chat:
        model: gpt-5-mini
    retry:
      max-attempts: 2

agent:

  limits:
    max-iterations: ${AGENT_MAX_ITERATIONS:8}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:15}
    max-context-tokens: ${AGENT_MAX_CONTEXT_TOKENS:12000}

  execution:
    timeout: ${AGENT_EXECUTION_TIMEOUT:90s}
    pool:
      core-size: ${AGENT_EXECUTION_POOL_CORE_SIZE:4}
      max-size: ${AGENT_EXECUTION_POOL_MAX_SIZE:8}
      queue-capacity: ${AGENT_EXECUTION_QUEUE_CAPACITY:16}
      keep-alive: ${AGENT_EXECUTION_KEEP_ALIVE:60s}

  memory:
    max-messages: ${AGENT_MEMORY_MAX_MESSAGES:20}

  approval:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-}]"
